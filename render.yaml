# Render Blueprint — New → Blueprint → pick this repository. Render asks for the values marked sync: false.
services:
  - type: web
    name: sanad
    runtime: node
    plan: free
    branch: feature/content-ingestion
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
